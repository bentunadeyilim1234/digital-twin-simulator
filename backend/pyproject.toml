[project]
name = "ssrdt-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14",
  "pandas>=2.2",
  "SALib>=1.5.1",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12",
]

[tool.uv]
# SALib declares matplotlib for its optional plotting helpers, which this app never imports.
override-dependencies = ["matplotlib; sys_platform == 'never'"]
